<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Grid</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Pokédex</h1>
    <p class="subtitle">Search through the first 20 Pokémon.</p>

    <input
      type="text"
      id="searchInput"
      placeholder="Search Pokémon..."
      autocomplete="off"
    >

    <p id="loading">Loading Pokémon...</p>

    <section id="pokemonGrid" class="pokemon-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
